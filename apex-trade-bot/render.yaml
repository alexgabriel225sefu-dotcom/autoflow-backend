services:
  - type: background
    name: apex-trade-bot
    env: node
    buildCommand: npm install
    startCommand: node src/index.js
    plan: free
    autoDeploy: false
    envVars:
      - key: LICENSE_KEY
        sync: false
      - key: EXCHANGE
        value: binance
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PAPER_TRADING
        value: true
      - key: PAPER_BALANCE
        value: "100"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
