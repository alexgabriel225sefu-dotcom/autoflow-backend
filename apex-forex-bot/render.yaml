services:
  # 'web' (not 'background') so it works on Render's FREE plan.
  # The bot's built-in dashboard binds to $PORT, so Render's health checks pass.
  - type: web
    name: apex-forex-bot
    env: python
    buildCommand: pip install -r requirements.txt
    # -u = unbuffered stdout so startup logs appear in Render's log tab in real time
    startCommand: python -u main.py
    plan: free
    autoDeploy: false
    envVars:
      # Unbuffered Python output — without this, print() is buffered and the
      # startup logs never show, making "the bot won't start" impossible to debug.
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      # Optional: Upstash persistence (settings/access survive redeploys)
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # Optional license — leave empty to run open (access via Telegram).
      - key: LICENSE_KEY
        sync: false
