services:
  # 'web' (not 'background') with a $PORT health check. Starter ($7/mo) so the
  # bot is always-on — a trading bot must run 24/7 to scan and trade, which
  # blows past the free 750h pool. On Starter it no longer needs the self-ping.
  - type: web
    name: apex-forex-bot
    env: python
    buildCommand: pip install -r requirements.txt
    # -u = unbuffered stdout so startup logs appear in Render's log tab in real time
    startCommand: python -u main.py
    plan: starter
    autoDeploy: true
    envVars:
      # Product identity — MUST be set; the bot refuses to start without it
      # to prevent cross-product Redis namespace contamination.
      - key: PRODUCT
        value: forex
      # Unbuffered Python output — without this, print() is buffered and the
      # startup logs never show, making "the bot won't start" impossible to debug.
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      # Optional: Upstash persistence (settings/access survive redeploys)
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # Optional license — leave empty to run open (access via Telegram).
      - key: LICENSE_KEY
        sync: false
