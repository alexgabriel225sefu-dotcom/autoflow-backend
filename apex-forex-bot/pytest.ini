[pytest]
testpaths = tests

# The default Python collector IMPORTS every matching file to find test
# functions, and these tests assert at module level and call sys.exit() — which
# is what made `pytest -q` fail with INTERNALERROR before collecting anything.
#
# Setting this to a pattern nothing matches disables that importer. tests/
# conftest.py then collects each script as a single item and runs it in a
# subprocess, which is how CI and developers already run them.
python_files = __no_python_file_collection__.py

addopts = -ra
