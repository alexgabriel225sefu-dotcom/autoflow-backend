services:
  - type: web
    name: autoflow-backend
    env: node
    buildCommand: npm install
    startCommand: node server.js
    # Starter ($7/mo) — must be always-on: serves the sales site + receives
    # Stripe webhooks (license delivery). On free tier the always-on bots
    # exhaust the shared 750h pool and suspend this too, taking the site and
    # webhook-based license delivery down with it.
    plan: starter
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: BOT_EMAIL_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SMTP_USER
        sync: false
      - key: BREVO_SMTP_PASS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: SENDER_EMAIL
        sync: false
      - key: SENDER_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_CODE
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: HEYGEN_API_KEY
        sync: false
      - key: CREATIFY_API_ID
        sync: false
      - key: CREATIFY_API_KEY
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: COURSE_BYPASS_CODE
        sync: false
      - key: RENDER
        value: "true"
