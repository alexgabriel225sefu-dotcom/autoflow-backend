name: Deploy AiCashSystem Ref Bot

on:
  workflow_dispatch:
    inputs:
      vm_ip:
        description: 'Oracle Cloud VM IP address'
        required: true
        type: string
      bot_token:
        description: 'Telegram bot token (paste here to bypass the GitHub secret)'
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/arcads-external-api-gExX7

      - name: Resolve + test token
        id: token
        env:
          INPUT_TOKEN: ${{ github.event.inputs.bot_token }}
          SECRET_TOKEN: ${{ secrets.AFFILIATE_BOT_TOKEN }}
        run: |
          RAW="$INPUT_TOKEN"
          if [ -z "$RAW" ]; then RAW="$SECRET_TOKEN"; fi
          CLEAN=$(printf '%s' "$RAW" | tr -d '\n\r\t ')
          echo "Token len: ${#CLEAN}, prefix: ${CLEAN:0:18}"
          RESP=$(curl -s --max-time 10 "https://api.telegram.org/bot${CLEAN}/getMe")
          echo "$RESP"
          if echo "$RESP" | grep -q '"ok":true'; then
            echo "TOKEN IS VALID"
            echo "value=$CLEAN" >> "$GITHUB_OUTPUT"
          else
            echo "TOKEN IS INVALID — paste a fresh token in the bot_token field"
            exit 1
          fi

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ github.event.inputs.vm_ip }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Wait for SSH (retry 5x)
        run: |
          for i in 1 2 3 4 5; do
            if ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -o BatchMode=yes \
              -o ConnectTimeout=20 \
              opc@${{ github.event.inputs.vm_ip }} "echo SSH_OK"; then
              echo "SSH OK on attempt $i"
              break
            fi
            echo "Attempt $i failed, waiting 20s..."
            sleep 20
            if [ $i -eq 5 ]; then
              echo "ERROR: Cannot connect. Reboot the VM from Oracle Cloud Console."
              exit 1
            fi
          done

      - name: Deploy affiliate bot code
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -o ConnectTimeout=120 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            opc@${{ github.event.inputs.vm_ip }} bash -s << 'REMOTE'
          set -e

          echo "[deploy] Downloading latest code..."
          sudo rm -rf /opt/apex-forex/apex-affiliate-bot
          sudo mkdir -p /opt/apex-forex/apex-affiliate-bot /tmp/apex-deploy

          curl -sL "https://github.com/alexgabriel225sefu-dotcom/autoflow-backend/archive/refs/heads/claude/arcads-external-api-gExX7.tar.gz" \
            | sudo tar xz -C /tmp/apex-deploy --strip-components=1

          sudo cp -r /tmp/apex-deploy/apex-affiliate-bot/. /opt/apex-forex/apex-affiliate-bot/
          sudo rm -rf /tmp/apex-deploy

          cd /opt/apex-forex/apex-affiliate-bot
          sudo python3 -m pip install -q --prefer-binary -r requirements.txt
          echo "[deploy] Code ready."
          REMOTE

      - name: Write .env to VM
        env:
          CLEAN_TOKEN: ${{ steps.token.outputs.value }}
          BOT_SECRET: ${{ secrets.AFFILIATE_BOT_SECRET }}
        run: |
          SEC="$BOT_SECRET"
          if [ -z "$SEC" ]; then SEC="apex-affiliate-bridge"; fi
          printf 'AFFILIATE_BOT_TOKEN=%s\nSITE_URL=https://aicashsystem.space\nAFFILIATE_BOT_SECRET=%s\nADMIN_CHAT_ID=7585109158\n' \
            "$CLEAN_TOKEN" "$SEC" | \
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            opc@${{ github.event.inputs.vm_ip }} \
            "sudo tee /opt/apex-forex/apex-affiliate-bot/.env > /dev/null"
          echo "[deploy] .env written."

      - name: Install + restart service
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            opc@${{ github.event.inputs.vm_ip }} bash -s << 'REMOTE'
          set -e

          sudo tee /etc/systemd/system/apex-affiliate.service > /dev/null << 'SERVICE'
[Unit]
Description=Apex Affiliate Bot
After=network.target
StartLimitIntervalSec=0

[Service]
Type=simple
WorkingDirectory=/opt/apex-forex/apex-affiliate-bot
ExecStart=/usr/bin/python3 main.py
Restart=always
RestartSec=10
TimeoutStopSec=15
KillMode=mixed
StandardOutput=append:/var/log/apex-affiliate.log
StandardError=append:/var/log/apex-affiliate.log
Environment=PYTHONUNBUFFERED=1

[Install]
WantedBy=multi-user.target
SERVICE

          sudo systemctl daemon-reload
          sudo systemctl enable apex-affiliate

          # Force-kill old process immediately so restart doesn't hang
          sudo systemctl kill --signal=SIGKILL apex-affiliate 2>/dev/null || true
          sleep 3
          sudo systemctl start apex-affiliate
          sleep 8
          sudo systemctl is-active apex-affiliate && echo "SUCCESS: Affiliate Bot running!" || \
            echo "WARN: Service may still be starting — check logs below"
          sudo tail -20 /var/log/apex-affiliate.log || true
          REMOTE
