name: Backtest (real market data)

on:
  workflow_dispatch:
  push:
    branches: [claude/arcads-external-api-gExX7]
    paths:
      - '.github/workflows/backtest.yml'
      - 'apex-forex-bot/backtest.py'

jobs:
  forex:
    name: Forex bot backtest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        working-directory: apex-forex-bot
        run: pip install -r requirements.txt
      - name: Backtest EUR_USD (Twelve Data)
        working-directory: apex-forex-bot
        env:
          PAPER_TRADING: 'true'
          BROKER: td
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          BT_SYMBOL: EUR_USD
          BT_CANDLES: '3000'
        run: |
          if [ -z "$TWELVE_DATA_KEY" ]; then
            echo "::warning::Secret TWELVE_DATA_KEY lipsește — rulez pe date sintetice (doar validare motor)."
            BT_SYNTHETIC=true python backtest.py
          else
            python backtest.py
          fi
      - name: Backtest GBP_USD (Twelve Data)
        if: always()
        working-directory: apex-forex-bot
        env:
          PAPER_TRADING: 'true'
          BROKER: td
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          BT_SYMBOL: GBP_USD
          BT_CANDLES: '3000'
        run: |
          if [ -n "$TWELVE_DATA_KEY" ]; then
            python backtest.py
          else
            echo "Sărit — fără TWELVE_DATA_KEY."
          fi
