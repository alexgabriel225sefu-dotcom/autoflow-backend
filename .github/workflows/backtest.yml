name: Backtest (real market data)

on:
  workflow_dispatch:
  push:
    branches: [claude/arcads-external-api-gExX7]
    paths: ['.github/workflows/backtest.yml']

jobs:
  crypto:
    name: Crypto bot backtest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        working-directory: apex-trade-bot
        run: npm install --omit=dev
      - name: Backtest SOLUSDT 5m
        working-directory: apex-trade-bot
        env:
          PAPER_TRADING: 'true'
          BT_SYMBOL: SOLUSDT
          BT_TIMEFRAME: 5m
          BT_CANDLES: '1000'
        run: node src/backtest.js
      - name: Backtest XRPUSDT 5m
        if: always()
        working-directory: apex-trade-bot
        env:
          PAPER_TRADING: 'true'
          BT_SYMBOL: XRPUSDT
          BT_TIMEFRAME: 5m
          BT_CANDLES: '1000'
        run: node src/backtest.js
      - name: Backtest DOGEUSDT 15m
        if: always()
        working-directory: apex-trade-bot
        env:
          PAPER_TRADING: 'true'
          BT_SYMBOL: DOGEUSDT
          BT_TIMEFRAME: 15m
          BT_CANDLES: '1000'
        run: node src/backtest.js

  forex:
    name: Forex bot backtest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        working-directory: apex-forex-bot
        run: pip install -r requirements.txt
      - name: Backtest EUR_USD (Twelve Data)
        working-directory: apex-forex-bot
        env:
          PAPER_TRADING: 'true'
          BROKER: td
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          BT_SYMBOL: EUR_USD
          BT_CANDLES: '3000'
        run: |
          if [ -z "$TWELVE_DATA_KEY" ]; then
            echo "::warning::Secret TWELVE_DATA_KEY lipsește — rulez pe date sintetice (doar validare motor)."
            BT_SYNTHETIC=true python backtest.py
          else
            python backtest.py
          fi
      - name: Backtest GBP_USD (Twelve Data)
        if: always()
        working-directory: apex-forex-bot
        env:
          PAPER_TRADING: 'true'
          BROKER: td
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          BT_SYMBOL: GBP_USD
          BT_CANDLES: '3000'
        run: |
          if [ -n "$TWELVE_DATA_KEY" ]; then
            python backtest.py
          else
            echo "Sărit — fără TWELVE_DATA_KEY."
          fi
