name: Deploy Web to Vercel

on:
  push:
    branches: [main, claude/arcads-external-api-gExX7]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/arcads-external-api-gExX7

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: html
        run: npm install

      - name: Find project with aicashsystem.space and deploy
        working-directory: html
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PK }}
        run: |
          # Find which Vercel project serves aicashsystem.space
          PROJECTS=$(curl -s \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects?limit=100")

          PROJECT_ID=$(echo "$PROJECTS" | node -e "
            let d='';
            process.stdin.on('data',c=>d+=c);
            process.stdin.on('end',()=>{
              try {
                const r=JSON.parse(d);
                const target='aicashsystem.space';
                const p=(r.projects||[]).find(p=>{
                  const aliases=p.alias||[];
                  return aliases.some(a=>
                    (typeof a==='string' && a.includes('aicashsystem')) ||
                    (a&&a.domain&&a.domain.includes('aicashsystem'))
                  );
                });
                console.log(p?p.id:'');
              } catch(e){ console.log(''); }
            });")

          if [ -n "$PROJECT_ID" ]; then
            echo "Deploying to project with aicashsystem.space: $PROJECT_ID"
            export VERCEL_PROJECT_ID="$PROJECT_ID"
          else
            echo "Domain not found in projects list, deploying to linked project"
          fi

          npx vercel deploy --prod --yes \
            --token "$VERCEL_TOKEN" \
            --env STRIPE_SECRET_KEY="$STRIPE_SECRET_KEY" \
            --env STRIPE_PUBLISHABLE_KEY="$STRIPE_PUBLISHABLE_KEY"
