name: Tuning sweep (real data)

on:
  workflow_dispatch:
  push:
    branches: [claude/arcads-external-api-gExX7]
    paths: ['.github/workflows/tuning.yml']

jobs:
  crypto:
    name: Crypto parameter sweep
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        working-directory: apex-trade-bot
        run: npm install --omit=dev
      - name: Sweep
        working-directory: apex-trade-bot
        env:
          PAPER_TRADING: 'true'
          BT_CANDLES: '4800'
        run: |
          run_cfg () {
            echo ""
            echo "############ CFG=$1 SYM=$2 ############"
            shift 2
            env "$@" BT_SYMBOL="$SYM" node src/backtest.js | grep -E "Perioadă|Win rate|Rezultat|Expectancy|Exituri|Max draw" || true
          }
          # ── Runda 6A: SL 1.6% pe ETH și BNB (netestate în R5C) ──────────────────────
          # R5: SOL +0.52% PF2.75, BTC +0.57% PF3.14 cu sl1.6-rr2 → testăm celelalte
          echo "======== RUNDA 6A: SL 1.6% ETH + BNB — confirmăm generalitatea (4800 lumânări) ========"
          for SYM in ETHUSDT BNBUSDT; do
            export SYM
            run_cfg mc5-sl1.6-rr2  "$SYM" MIN_CRITERIA=5 TRAILING_STOP=false BREAKEVEN_AT_R=0 STOP_LOSS_PCT=0.016 TAKE_PROFIT_PCT=0.032 BT_CANDLES=4800
            run_cfg mc5-sl1.6-rr3  "$SYM" MIN_CRITERIA=5 TRAILING_STOP=false BREAKEVEN_AT_R=0 STOP_LOSS_PCT=0.016 TAKE_PROFIT_PCT=0.048 BT_CANDLES=4800
          done

          echo ""
          echo "======== RUNDA 6B: SL 2.0% sweep — mai larg decât 1.6% (4800 lumânări) ========"
          # Testăm dacă SL 2% reduce și mai mult whipsaw → WR și mai mare
          for SYM in SOLUSDT XRPUSDT BTCUSDT; do
            export SYM
            run_cfg mc5-sl2.0-rr2  "$SYM" MIN_CRITERIA=5 TRAILING_STOP=false BREAKEVEN_AT_R=0 STOP_LOSS_PCT=0.020 TAKE_PROFIT_PCT=0.040 BT_CANDLES=4800
            run_cfg mc5-sl2.0-rr3  "$SYM" MIN_CRITERIA=5 TRAILING_STOP=false BREAKEVEN_AT_R=0 STOP_LOSS_PCT=0.020 TAKE_PROFIT_PCT=0.060 BT_CANDLES=4800
          done

          echo ""
          echo "======== RUNDA 6C: BNB SL 1.6% + risk sizing (mc4 câștigător R5) ========"
          # BNB mc4-rr3 +0.20% în R5; testăm mc4 cu SL larg pe BNB
          for SYM in BNBUSDT; do
            export SYM
            run_cfg bnb-sl1.6-rr2  "$SYM" MIN_CRITERIA=5 TRAILING_STOP=false BREAKEVEN_AT_R=0 STOP_LOSS_PCT=0.016 TAKE_PROFIT_PCT=0.032 BT_CANDLES=4800
            run_cfg bnb-mc4-sl1.6-rr2  "$SYM" MIN_CRITERIA=4 TRAILING_STOP=false BREAKEVEN_AT_R=0 STOP_LOSS_PCT=0.016 TAKE_PROFIT_PCT=0.032 BT_CANDLES=4800
          done

  forex:
    name: Forex parameter sweep
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        working-directory: apex-forex-bot
        run: pip install -r requirements.txt
      - name: Sweep
        working-directory: apex-forex-bot
        env:
          PAPER_TRADING: 'true'
          BROKER: td
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          BT_CANDLES: '4800'
        run: |
          if [ -z "$TWELVE_DATA_KEY" ]; then
            echo "::error::Secret TWELVE_DATA_KEY lipsește"; exit 1
          fi
          run_cfg () {
            echo ""
            echo "############ CFG=$1 SYM=$2 ############"
            local sym="$2"; shift 2
            env "$@" BT_SYMBOL="$sym" python backtest.py | grep -E "Perioadă|Win rate|Rezultat|Expectancy|Exituri|Max DD" || true
            sleep 12  # TD free tier: 8 credite/min
          }
          echo "======== RUNDA 6A: NZD_USD confirmare R:R sweep (câștigător R5 +2.10%) ========"
          # R5: nzd-rr4 = +2.10%, PF 2.94, 50% WR; confirmăm cu mai multe configurații
          run_cfg nzd-sl20-rr3    NZD_USD MIN_CRITERIA=4 BT_HTF_STRICT=true TRAILING_STOP=false BREAKEVEN_AT_R=0 STOP_LOSS_PIPS=20 TAKE_PROFIT_PIPS=60
          run_cfg nzd-sl25-rr3    NZD_USD MIN_CRITERIA=4 BT_HTF_STRICT=true TRAILING_STOP=false BREAKEVEN_AT_R=0 STOP_LOSS_PIPS=25 TAKE_PROFIT_PIPS=75
          run_cfg nzd-sl25-rr4    NZD_USD MIN_CRITERIA=4 BT_HTF_STRICT=true TRAILING_STOP=false BREAKEVEN_AT_R=0 STOP_LOSS_PIPS=25 TAKE_PROFIT_PIPS=100
          run_cfg nzd-sl25-rr5    NZD_USD MIN_CRITERIA=4 BT_HTF_STRICT=true TRAILING_STOP=false BREAKEVEN_AT_R=0 STOP_LOSS_PIPS=25 TAKE_PROFIT_PIPS=125
          run_cfg nzd-sl30-rr3    NZD_USD MIN_CRITERIA=4 BT_HTF_STRICT=true TRAILING_STOP=false BREAKEVEN_AT_R=0 STOP_LOSS_PIPS=30 TAKE_PROFIT_PIPS=90

          echo ""
          echo "======== RUNDA 6B: NZD_USD risk sizing pe winner (rr4) ========"
          # Validăm că edge-ul scalează; NZD rr4 e mai bun decât AUD?
          run_cfg nzd-r0.5pct     NZD_USD MIN_CRITERIA=4 BT_HTF_STRICT=true TRAILING_STOP=false BREAKEVEN_AT_R=0 STOP_LOSS_PIPS=25 TAKE_PROFIT_PIPS=100 RISK_PER_TRADE=0.005
          run_cfg nzd-r1pct       NZD_USD MIN_CRITERIA=4 BT_HTF_STRICT=true TRAILING_STOP=false BREAKEVEN_AT_R=0 STOP_LOSS_PIPS=25 TAKE_PROFIT_PIPS=100 RISK_PER_TRADE=0.01
          run_cfg nzd-r2pct       NZD_USD MIN_CRITERIA=4 BT_HTF_STRICT=true TRAILING_STOP=false BREAKEVEN_AT_R=0 STOP_LOSS_PIPS=25 TAKE_PROFIT_PIPS=100 RISK_PER_TRADE=0.02

          echo ""
          echo "======== RUNDA 6C: AUD + NZD mc3 (mai multe trade-uri) + USD_CAD ========"
          # mc3 pe NZD: mai multe trade-uri, poate la fel pozitive
          run_cfg nzd-mc3-sl25-rr4 NZD_USD MIN_CRITERIA=3 BT_HTF_STRICT=true TRAILING_STOP=false BREAKEVEN_AT_R=0 STOP_LOSS_PIPS=25 TAKE_PROFIT_PIPS=100
          run_cfg aud-sl25-rr4     AUD_USD MIN_CRITERIA=4 BT_HTF_STRICT=true TRAILING_STOP=false BREAKEVEN_AT_R=0 STOP_LOSS_PIPS=25 TAKE_PROFIT_PIPS=100
          run_cfg aud-sl30-rr3     AUD_USD MIN_CRITERIA=4 BT_HTF_STRICT=true TRAILING_STOP=false BREAKEVEN_AT_R=0 STOP_LOSS_PIPS=30 TAKE_PROFIT_PIPS=90
          # USD_CAD — corelat cu petrolul, posibil comportament diferit
          run_cfg cad-mc4-sl25-rr3 USD_CAD MIN_CRITERIA=4 BT_HTF_STRICT=true TRAILING_STOP=false BREAKEVEN_AT_R=0 STOP_LOSS_PIPS=25 TAKE_PROFIT_PIPS=75
          run_cfg cad-mc4-sl25-rr4 USD_CAD MIN_CRITERIA=4 BT_HTF_STRICT=true TRAILING_STOP=false BREAKEVEN_AT_R=0 STOP_LOSS_PIPS=25 TAKE_PROFIT_PIPS=100
