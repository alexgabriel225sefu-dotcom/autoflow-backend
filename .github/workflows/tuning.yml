name: Tuning sweep (real data)

on:
  workflow_dispatch:
  push:
    branches: [claude/arcads-external-api-gExX7]
    paths: ['.github/workflows/tuning.yml']

jobs:
  crypto:
    name: Crypto parameter sweep
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        working-directory: apex-trade-bot
        run: npm install --omit=dev
      - name: Sweep
        working-directory: apex-trade-bot
        env:
          PAPER_TRADING: 'true'
          BT_CANDLES: '4800'
        run: |
          run_cfg () {
            echo ""
            echo "############ CFG=$1 SYM=$2 ############"
            shift 2
            env "$@" BT_SYMBOL="$SYM" node src/backtest.js | grep -E "Perioadă|Win rate|Rezultat|Expectancy|Exituri|Max draw" || true
          }
          # ── Runda 7A: ETH + XRP sl1.6 R:R gap-fill ─────────────────────────────────
          # R6: ETH sl1.6-rr3=+0.46% PF1.73; rr2 untested on ETH. XRP only sl2.0 in R6.
          echo "======== RUNDA 7A: ETH + XRP sl1.6 R:R sweep — umplem golurile din R6 ========"
          for SYM in ETHUSDT XRPUSDT; do
            export SYM
            run_cfg mc5-sl1.6-rr2  "$SYM" MIN_CRITERIA=5 TRAILING_STOP=false BREAKEVEN_AT_R=0 STOP_LOSS_PCT=0.016 TAKE_PROFIT_PCT=0.032 BT_CANDLES=4800
            run_cfg mc5-sl1.6-rr3  "$SYM" MIN_CRITERIA=5 TRAILING_STOP=false BREAKEVEN_AT_R=0 STOP_LOSS_PCT=0.016 TAKE_PROFIT_PCT=0.048 BT_CANDLES=4800
          done

          echo ""
          echo "======== RUNDA 7B: Validare long-window (9600 lumânări ≈33 zile) câștigători confirmați ========"
          # BTC sl1.6-rr2 +0.57% PF3.14 (R5), SOL sl1.6-rr2 +0.52% PF2.75 (R5)
          # ETH sl1.6-rr3 +0.46% PF1.73 (R6) — testăm robustețea pe fereastră dublă
          for SYM in BTCUSDT SOLUSDT ETHUSDT; do
            export SYM
            run_cfg mc5-sl1.6-rr2-9600  "$SYM" MIN_CRITERIA=5 TRAILING_STOP=false BREAKEVEN_AT_R=0 STOP_LOSS_PCT=0.016 TAKE_PROFIT_PCT=0.032 BT_CANDLES=9600
          done
          # ETH winner este rr3, nu rr2 — testăm și rr3 pe long window
          export SYM=ETHUSDT
          run_cfg mc5-sl1.6-rr3-9600  "$SYM" MIN_CRITERIA=5 TRAILING_STOP=false BREAKEVEN_AT_R=0 STOP_LOSS_PCT=0.016 TAKE_PROFIT_PCT=0.048 BT_CANDLES=9600

          echo ""
          echo "======== RUNDA 7C: ADAUSDT vs ETHUSDT — validăm swap-ul din lista default ========"
          # Am eliminat ADA și adăugat ETH în lista default. Confirmăm că ETH > ADA.
          for SYM in ADAUSDT BNBUSDT; do
            export SYM
            run_cfg mc5-sl1.6-rr2  "$SYM" MIN_CRITERIA=5 TRAILING_STOP=false BREAKEVEN_AT_R=0 STOP_LOSS_PCT=0.016 TAKE_PROFIT_PCT=0.032 BT_CANDLES=4800
            run_cfg mc5-sl1.6-rr3  "$SYM" MIN_CRITERIA=5 TRAILING_STOP=false BREAKEVEN_AT_R=0 STOP_LOSS_PCT=0.016 TAKE_PROFIT_PCT=0.048 BT_CANDLES=4800
          done

  forex:
    name: Forex parameter sweep
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        working-directory: apex-forex-bot
        run: pip install -r requirements.txt
      - name: Sweep
        working-directory: apex-forex-bot
        env:
          PAPER_TRADING: 'true'
          BROKER: td
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          BT_CANDLES: '4800'
        run: |
          if [ -z "$TWELVE_DATA_KEY" ]; then
            echo "::error::Secret TWELVE_DATA_KEY lipsește"; exit 1
          fi
          run_cfg () {
            echo ""
            echo "############ CFG=$1 SYM=$2 ############"
            local sym="$2"; shift 2
            env "$@" BT_SYMBOL="$sym" python backtest.py | grep -E "Perioadă|Win rate|Rezultat|Expectancy|Exituri|Max DD" || true
            sleep 12  # TD free tier: 8 credite/min
          }
          echo "======== RUNDA 7A: Validare cross-simbol sl30-rr3 (câștigătorul R6 NZD +2.59%) ========"
          # Dacă edge-ul e în semnal (nu NZD-specific), sl30-rr3 trebuie să funcționeze și pe alte perechi
          run_cfg eur-sl30-rr3    EUR_USD MIN_CRITERIA=4 BT_HTF_STRICT=true TRAILING_STOP=false BREAKEVEN_AT_R=0 STOP_LOSS_PIPS=30 TAKE_PROFIT_PIPS=90
          run_cfg cad-sl30-rr3    USD_CAD MIN_CRITERIA=4 BT_HTF_STRICT=true TRAILING_STOP=false BREAKEVEN_AT_R=0 STOP_LOSS_PIPS=30 TAKE_PROFIT_PIPS=90
          run_cfg jpy-sl30-rr3    USD_JPY MIN_CRITERIA=4 BT_HTF_STRICT=true TRAILING_STOP=false BREAKEVEN_AT_R=0 STOP_LOSS_PIPS=30 TAKE_PROFIT_PIPS=90
          # NZD: re-run ca referință de ancorare (date fresh)
          run_cfg nzd-sl30-rr3    NZD_USD MIN_CRITERIA=4 BT_HTF_STRICT=true TRAILING_STOP=false BREAKEVEN_AT_R=0 STOP_LOSS_PIPS=30 TAKE_PROFIT_PIPS=90

          echo ""
          echo "======== RUNDA 7B: NZD sl30 R:R bracket — rr2/rr4 vs rr3 câștigător ========"
          # rr3 (90p TP) câștigă R6. Testăm dacă rr2 (mai multe exituri) sau rr4 (mai rar) bat rr3.
          run_cfg nzd-sl30-rr2    NZD_USD MIN_CRITERIA=4 BT_HTF_STRICT=true TRAILING_STOP=false BREAKEVEN_AT_R=0 STOP_LOSS_PIPS=30 TAKE_PROFIT_PIPS=60
          run_cfg nzd-sl30-rr4    NZD_USD MIN_CRITERIA=4 BT_HTF_STRICT=true TRAILING_STOP=false BREAKEVEN_AT_R=0 STOP_LOSS_PIPS=30 TAKE_PROFIT_PIPS=120
          run_cfg nzd-sl35-rr3    NZD_USD MIN_CRITERIA=4 BT_HTF_STRICT=true TRAILING_STOP=false BREAKEVEN_AT_R=0 STOP_LOSS_PIPS=35 TAKE_PROFIT_PIPS=105

          echo ""
          echo "======== RUNDA 7C: AUD recovery probe + USD_CAD sl30 ========"
          # AUD era +0.40% în R5, dar -0.97% și -1.56% în R6 cu sl25/sl30-rr4/rr3.
          # Testăm AUD cu sl mai mic (sl20) și rr2/rr3 — poate AUD preferă SL mai strâns.
          run_cfg aud-sl20-rr2    AUD_USD MIN_CRITERIA=4 BT_HTF_STRICT=true TRAILING_STOP=false BREAKEVEN_AT_R=0 STOP_LOSS_PIPS=20 TAKE_PROFIT_PIPS=40
          run_cfg aud-sl20-rr3    AUD_USD MIN_CRITERIA=4 BT_HTF_STRICT=true TRAILING_STOP=false BREAKEVEN_AT_R=0 STOP_LOSS_PIPS=20 TAKE_PROFIT_PIPS=60
          run_cfg aud-sl25-rr3    AUD_USD MIN_CRITERIA=4 BT_HTF_STRICT=true TRAILING_STOP=false BREAKEVEN_AT_R=0 STOP_LOSS_PIPS=25 TAKE_PROFIT_PIPS=75
          # USD_CAD sl30-rr3 — dacă sl30 funcționează cross-simbol, CAD e candidat pentru SCAN_SYMBOLS
          run_cfg cad-sl30-rr4    USD_CAD MIN_CRITERIA=4 BT_HTF_STRICT=true TRAILING_STOP=false BREAKEVEN_AT_R=0 STOP_LOSS_PIPS=30 TAKE_PROFIT_PIPS=120
