name: Tuning sweep (real data)

on:
  workflow_dispatch:
  push:
    branches: [claude/arcads-external-api-gExX7]
    paths: ['.github/workflows/tuning.yml']

jobs:
  crypto:
    name: Crypto parameter sweep
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        working-directory: apex-trade-bot
        run: npm install --omit=dev
      - name: Sweep
        working-directory: apex-trade-bot
        env:
          PAPER_TRADING: 'true'
          BT_CANDLES: '1200'
        run: |
          run_cfg () {
            echo ""
            echo "############ CFG=$1 SYM=$2 ############"
            shift 2
            env "$@" BT_SYMBOL="$SYM" node src/backtest.js | grep -E "Perioadă|Win rate|Rezultat|Expectancy|Exituri|Max draw" || true
          }
          # Runda 2: exiturile sunt suspectul principal — trailingul strâns taie
          # câștigurile la valori mici în timp ce pierderile rămân întregi
          for SYM in SOLUSDT XRPUSDT DOGEUSDT; do
            export SYM
            run_cfg pure-tp       "$SYM" TRAILING_STOP=false BREAKEVEN_AT_R=0
            run_cfg no-trail      "$SYM" TRAILING_STOP=false
            run_cfg no-be         "$SYM" BREAKEVEN_AT_R=0
            run_cfg loose-trail   "$SYM" TRAILING_STOP_DIST=0.03 RUNNER_TRAIL_DIST=0.015 BREAKEVEN_AT_R=1.5
            run_cfg strict+pure   "$SYM" MIN_CRITERIA=4 BT_HTF_STRICT=true TRAILING_STOP=false BREAKEVEN_AT_R=0
          done

  forex:
    name: Forex parameter sweep
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        working-directory: apex-forex-bot
        run: pip install -r requirements.txt
      - name: Sweep
        working-directory: apex-forex-bot
        env:
          PAPER_TRADING: 'true'
          BROKER: td
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          BT_CANDLES: '3000'
        run: |
          if [ -z "$TWELVE_DATA_KEY" ]; then
            echo "::error::Secret TWELVE_DATA_KEY lipsește"; exit 1
          fi
          run_cfg () {
            echo ""
            echo "############ CFG=$1 SYM=$2 ############"
            local sym="$2"; shift 2
            env "$@" BT_SYMBOL="$sym" python backtest.py | grep -E "Perioadă|Win rate|Rezultat|Expectancy|Exituri|Max DD" || true
            sleep 10  # TD free tier: 8 credite/min
          }
          run_cfg pure-tp      EUR_USD TRAILING_STOP=false BREAKEVEN_AT_R=0
          run_cfg no-trail     EUR_USD TRAILING_STOP=false
          run_cfg loose-trail  EUR_USD TRAILING_STOP_PIPS=25 RUNNER_TRAIL_PIPS=12 BREAKEVEN_AT_R=1.5
          run_cfg strict+pure  EUR_USD BT_HTF_STRICT=true TRAILING_STOP=false BREAKEVEN_AT_R=0
          run_cfg pure-tp      GBP_USD TRAILING_STOP=false BREAKEVEN_AT_R=0
          run_cfg strict+pure  GBP_USD BT_HTF_STRICT=true TRAILING_STOP=false BREAKEVEN_AT_R=0
