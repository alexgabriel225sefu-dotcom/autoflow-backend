name: Tuning sweep (real data)

on:
  workflow_dispatch:
  push:
    branches: [claude/arcads-external-api-gExX7]
    paths: ['.github/workflows/tuning.yml']

jobs:
  forex:
    name: Forex parameter sweep
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        working-directory: apex-forex-bot
        run: pip install -r requirements.txt
      - name: Sweep
        working-directory: apex-forex-bot
        env:
          PAPER_TRADING: 'true'
          BROKER: td
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          BT_CANDLES: '4800'
        run: |
          if [ -z "$TWELVE_DATA_KEY" ]; then
            echo "::error::Secret TWELVE_DATA_KEY lipsește"; exit 1
          fi
          run_cfg () {
            echo ""
            echo "############ CFG=$1 SYM=$2 ############"
            local sym="$2"; shift 2
            env "$@" BT_SYMBOL="$sym" python backtest.py | grep -E "Perioadă|Win rate|Rezultat|Expectancy|Exituri|Max DD" || true
            sleep 12  # TD free tier: 8 credite/min
          }
          echo "======== RUNDA 9A: NZD sl20-rr2 a 2-a fereastră — cel mai bun config din R8 ========"
          # R8: nzd-sl20-rr2 = +2.03% PF1.87 (o singură fereastră). Testăm pe date noi.
          # Dacă confirmă, actualizăm config-ul la sl20/40p din sl30/60p.
          run_cfg nzd-sl20-rr2    NZD_USD MIN_CRITERIA=4 BT_HTF_STRICT=true TRAILING_STOP=false BREAKEVEN_AT_R=0 STOP_LOSS_PIPS=20 TAKE_PROFIT_PIPS=40
          # sl30-rr2 ca referință pe același window nou
          run_cfg nzd-sl30-rr2    NZD_USD MIN_CRITERIA=4 BT_HTF_STRICT=true TRAILING_STOP=false BREAKEVEN_AT_R=0 STOP_LOSS_PIPS=30 TAKE_PROFIT_PIPS=60

          echo ""
          echo "======== RUNDA 9B: NZD sl20 R:R bracket — rr2 vs rr3 pe sl20 ========"
          # sl20-rr2 câștigă în R8. Testăm dacă rr3 (60p TP) sau rr4 (80p) bat rr2 (40p).
          run_cfg nzd-sl20-rr3    NZD_USD MIN_CRITERIA=4 BT_HTF_STRICT=true TRAILING_STOP=false BREAKEVEN_AT_R=0 STOP_LOSS_PIPS=20 TAKE_PROFIT_PIPS=60
          run_cfg nzd-sl20-rr4    NZD_USD MIN_CRITERIA=4 BT_HTF_STRICT=true TRAILING_STOP=false BREAKEVEN_AT_R=0 STOP_LOSS_PIPS=20 TAKE_PROFIT_PIPS=80

          echo ""
          echo "======== RUNDA 9C: Config default final forex — NZD sl30-rr2 pe toate perechile ========"
          # NZD sl30-rr2 e confirmat pe 3 ferestre. Testăm configurația default actuală pe
          # toate perechile din SCAN_SYMBOLS pentru a vedea performanța agregată a botului.
          for sym in NZD_USD AUD_USD EUR_USD USD_JPY USD_CAD; do
            run_cfg final-sl30-rr2  "$sym" MIN_CRITERIA=4 BT_HTF_STRICT=true TRAILING_STOP=false BREAKEVEN_AT_R=0 STOP_LOSS_PIPS=30 TAKE_PROFIT_PIPS=60
          done
