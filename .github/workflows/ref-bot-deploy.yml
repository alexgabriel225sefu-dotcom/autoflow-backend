name: Deploy AiCashSystem Ref Bot

on:
  workflow_dispatch:
    inputs:
      vm_ip:
        description: 'Oracle Cloud VM IP address'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/arcads-external-api-gExX7

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ github.event.inputs.vm_ip }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Wait for SSH (retry 8x)
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            if ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -o BatchMode=yes \
              -o ConnectTimeout=20 \
              opc@${{ github.event.inputs.vm_ip }} "echo SSH_OK"; then
              echo "SSH OK on attempt $i"
              break
            fi
            echo "Attempt $i failed, waiting 20s..."
            sleep 20
            if [ $i -eq 8 ]; then
              echo "ERROR: Cannot connect. Reboot the VM from Oracle Cloud Console."
              exit 1
            fi
          done

      - name: Deploy affiliate bot code
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -o ConnectTimeout=120 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            opc@${{ github.event.inputs.vm_ip }} bash -s << 'REMOTE'
          set -e
          echo "[deploy] Downloading latest code..."
          sudo rm -rf /opt/apex-forex/apex-affiliate-bot
          sudo mkdir -p /opt/apex-forex/apex-affiliate-bot
          sudo mkdir -p /tmp/apex-deploy
          curl -sL "https://github.com/alexgabriel225sefu-dotcom/autoflow-backend/archive/refs/heads/claude/arcads-external-api-gExX7.tar.gz" \
            | sudo tar xz -C /tmp/apex-deploy --strip-components=1
          sudo cp -r /tmp/apex-deploy/apex-affiliate-bot/. /opt/apex-forex/apex-affiliate-bot/
          sudo rm -rf /tmp/apex-deploy
          sudo python3 -m pip install -q requests python-dotenv certifi 2>/dev/null || true
          echo "[deploy] Code ready."
          REMOTE

      - name: Write env file + start bot
        run: |
          CERTIFI=$(ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=20 \
            opc@${{ github.event.inputs.vm_ip }} \
            "python3 -c 'import certifi; print(certifi.where())' 2>/dev/null || echo '/etc/ssl/certs/ca-bundle.crt'")
          echo "Certifi path: $CERTIFI"

          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=5 \
            opc@${{ github.event.inputs.vm_ip }} bash -s << REMOTE
          set -e

          # Write env file with NO indentation (systemd EnvironmentFile format)
          sudo tee /opt/apex-forex/apex-affiliate-bot/bot.env > /dev/null << 'ENVEOF'
AFFILIATE_BOT_TOKEN=${{ secrets.AFFILIATE_BOT_TOKEN }}
SITE_URL=https://aicashsystem.space
AFFILIATE_BOT_SECRET=${{ secrets.AFFILIATE_BOT_SECRET }}
REQUESTS_CA_BUNDLE=$CERTIFI
ENVEOF

          echo "--- ENV FILE ---"
          sudo grep -v TOKEN /opt/apex-forex/apex-affiliate-bot/bot.env || true
          echo "TOKEN line exists: \$(sudo grep -c AFFILIATE_BOT_TOKEN /opt/apex-forex/apex-affiliate-bot/bot.env)"

          # Systemd service using EnvironmentFile (bypasses python-dotenv entirely)
          sudo tee /etc/systemd/system/apex-affiliate.service > /dev/null << 'SERVICE'
[Unit]
Description=Apex Affiliate Bot
After=network.target
StartLimitIntervalSec=0

[Service]
Type=simple
WorkingDirectory=/opt/apex-forex/apex-affiliate-bot
EnvironmentFile=/opt/apex-forex/apex-affiliate-bot/bot.env
ExecStart=/usr/bin/python3 main.py
Restart=always
RestartSec=10
StandardOutput=append:/var/log/apex-affiliate.log
StandardError=append:/var/log/apex-affiliate.log
Environment=PYTHONUNBUFFERED=1

[Install]
WantedBy=multi-user.target
SERVICE

          sudo systemctl daemon-reload
          sudo systemctl enable apex-affiliate
          sudo systemctl restart apex-affiliate
          sleep 8
          sudo systemctl is-active apex-affiliate && echo "SUCCESS: Bot running!" || \
            (echo "FAILED" && sudo tail -20 /var/log/apex-affiliate.log && exit 1)
          REMOTE

      - name: Show bot logs
        run: |
          sleep 5
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=20 \
            opc@${{ github.event.inputs.vm_ip }} \
            "sudo tail -15 /var/log/apex-affiliate.log 2>/dev/null || echo '(no log)'"
