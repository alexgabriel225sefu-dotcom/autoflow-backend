name: Deploy AiCashSystem Ref Bot

on:
  workflow_dispatch:
    inputs:
      vm_ip:
        description: 'Oracle Cloud VM IP address'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/arcads-external-api-gExX7

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ github.event.inputs.vm_ip }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Wait for SSH (retry 8x)
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            if ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -o BatchMode=yes \
              -o ConnectTimeout=20 \
              opc@${{ github.event.inputs.vm_ip }} "echo SSH_OK"; then
              echo "SSH OK on attempt $i"
              break
            fi
            echo "Attempt $i failed, waiting 20s..."
            sleep 20
            if [ $i -eq 8 ]; then
              echo "ERROR: Cannot connect."
              exit 1
            fi
          done

      - name: Deploy + configure + start bot
        env:
          BOT_TOKEN: ${{ secrets.AFFILIATE_BOT_TOKEN }}
          BOT_SECRET: ${{ secrets.AFFILIATE_BOT_SECRET }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -o ConnectTimeout=120 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            opc@${{ github.event.inputs.vm_ip }} bash -s << 'REMOTE'
          set -e

          echo "[1] Downloading code..."
          sudo rm -rf /opt/apex-forex/apex-affiliate-bot
          sudo mkdir -p /opt/apex-forex/apex-affiliate-bot /tmp/apex-deploy
          curl -sL "https://github.com/alexgabriel225sefu-dotcom/autoflow-backend/archive/refs/heads/claude/arcads-external-api-gExX7.tar.gz" \
            | sudo tar xz -C /tmp/apex-deploy --strip-components=1
          sudo cp -r /tmp/apex-deploy/apex-affiliate-bot/. /opt/apex-forex/apex-affiliate-bot/
          sudo rm -rf /tmp/apex-deploy
          sudo python3 -m pip install -q requests python-dotenv certifi 2>/dev/null || true

          echo "[2] Writing env file..."
          CERTIFI=$(python3 -c 'import certifi; print(certifi.where())' 2>/dev/null || echo '/etc/ssl/certs/ca-bundle.crt')
          echo "Certifi: $CERTIFI"
          REMOTE

          # Pass secrets as SSH env vars — no file needed, no parsing issues
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o SendEnv=BOT_TOKEN \
            -o SendEnv=BOT_SECRET \
            opc@${{ github.event.inputs.vm_ip }} bash -s << 'REMOTE2'
          set -e

          CERTIFI=$(python3 -c 'import certifi; print(certifi.where())' 2>/dev/null || echo '/etc/ssl/certs/ca-bundle.crt')

          printf 'AFFILIATE_BOT_TOKEN=%s\nSITE_URL=https://aicashsystem.space\nAFFILIATE_BOT_SECRET=%s\nREQUESTS_CA_BUNDLE=%s\n' \
            "$BOT_TOKEN" "$BOT_SECRET" "$CERTIFI" \
            | sudo tee /opt/apex-forex/apex-affiliate-bot/bot.env > /dev/null

          echo "TOKEN line count: $(sudo grep -c AFFILIATE_BOT_TOKEN /opt/apex-forex/apex-affiliate-bot/bot.env)"
          echo "Other vars:"
          sudo grep -v TOKEN /opt/apex-forex/apex-affiliate-bot/bot.env

          printf '[Unit]\nDescription=Apex Affiliate Bot\nAfter=network.target\nStartLimitIntervalSec=0\n\n[Service]\nType=simple\nWorkingDirectory=/opt/apex-forex/apex-affiliate-bot\nEnvironmentFile=/opt/apex-forex/apex-affiliate-bot/bot.env\nExecStart=/usr/bin/python3 main.py\nRestart=always\nRestartSec=10\nStandardOutput=append:/var/log/apex-affiliate.log\nStandardError=append:/var/log/apex-affiliate.log\nEnvironment=PYTHONUNBUFFERED=1\n\n[Install]\nWantedBy=multi-user.target\n' \
            | sudo tee /etc/systemd/system/apex-affiliate.service > /dev/null

          sudo systemctl daemon-reload
          sudo systemctl enable apex-affiliate
          sudo systemctl restart apex-affiliate
          sleep 8
          sudo systemctl is-active apex-affiliate && echo "SUCCESS: Bot running!" || \
            (echo "FAILED" && sudo tail -20 /var/log/apex-affiliate.log && exit 1)
          REMOTE2

      - name: Show bot logs
        run: |
          sleep 5
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=20 \
            opc@${{ github.event.inputs.vm_ip }} \
            "sudo tail -15 /var/log/apex-affiliate.log 2>/dev/null || echo '(no log)'"
