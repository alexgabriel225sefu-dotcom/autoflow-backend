name: Deploy AiCashSystem Ref Bot

on:
  workflow_dispatch:
    inputs:
      vm_ip:
        description: 'Oracle Cloud VM IP address'
        required: true
        type: string
      bot_token:
        description: 'Telegram bot token (paste here to bypass the GitHub secret)'
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/arcads-external-api-gExX7

      - name: Resolve + test token
        id: token
        env:
          INPUT_TOKEN: ${{ github.event.inputs.bot_token }}
          SECRET_TOKEN: ${{ secrets.AFFILIATE_BOT_TOKEN }}
        run: |
          # Prefer the UI input; fall back to the secret. Strip all whitespace.
          RAW="$INPUT_TOKEN"
          if [ -z "$RAW" ]; then RAW="$SECRET_TOKEN"; fi
          CLEAN=$(printf '%s' "$RAW" | tr -d '\n\r\t ')
          echo "Token len: ${#CLEAN}, prefix: ${CLEAN:0:18}"
          RESP=$(curl -s --max-time 10 "https://api.telegram.org/bot${CLEAN}/getMe")
          echo "$RESP"
          if echo "$RESP" | grep -q '"ok":true'; then
            echo "TOKEN IS VALID"
            echo "value=$CLEAN" >> "$GITHUB_OUTPUT"
          else
            echo "TOKEN IS INVALID - paste a fresh token in the bot_token field"
            exit 1
          fi

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ github.event.inputs.vm_ip }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Wait for SSH (retry 5x)
        run: |
          for i in 1 2 3 4 5; do
            if ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -o BatchMode=yes \
              -o ConnectTimeout=20 \
              opc@${{ github.event.inputs.vm_ip }} "echo SSH_OK"; then
              echo "SSH OK on attempt $i"
              break
            fi
            echo "Attempt $i failed, waiting 20s..."
            sleep 20
            if [ $i -eq 5 ]; then
              echo "ERROR: Cannot connect."
              exit 1
            fi
          done

      - name: Deploy affiliate bot code
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -o ConnectTimeout=120 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            opc@${{ github.event.inputs.vm_ip }} bash -s << 'REMOTE'
          set -e
          sudo rm -rf /opt/apex-forex/apex-affiliate-bot
          sudo mkdir -p /opt/apex-forex/apex-affiliate-bot /tmp/apex-deploy
          curl -sL "https://github.com/alexgabriel225sefu-dotcom/autoflow-backend/archive/refs/heads/claude/arcads-external-api-gExX7.tar.gz" \
            | sudo tar xz -C /tmp/apex-deploy --strip-components=1
          sudo cp -r /tmp/apex-deploy/apex-affiliate-bot/. /opt/apex-forex/apex-affiliate-bot/
          sudo rm -rf /tmp/apex-deploy
          sudo python3 -m pip install -q --prefer-binary -r /opt/apex-forex/apex-affiliate-bot/requirements.txt
          echo "[deploy] Code ready."
          REMOTE

      - name: Write .env to VM
        env:
          CLEAN_TOKEN: ${{ steps.token.outputs.value }}
          BOT_SECRET: ${{ secrets.AFFILIATE_BOT_SECRET }}
        run: |
          SEC="$BOT_SECRET"
          if [ -z "$SEC" ]; then SEC="apex-affiliate-bridge"; fi
          printf 'AFFILIATE_BOT_TOKEN=%s\nSITE_URL=https://aicashsystem.space\nAFFILIATE_BOT_SECRET=%s\n' \
            "$CLEAN_TOKEN" "$SEC" | \
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            opc@${{ github.event.inputs.vm_ip }} \
            "sudo tee /opt/apex-forex/apex-affiliate-bot/.env > /dev/null"

      - name: Start affiliate bot
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=5 \
            opc@${{ github.event.inputs.vm_ip }} bash -s << 'REMOTE'
          set -e
          printf '[Unit]\nDescription=Apex Affiliate Bot\nAfter=network.target\nStartLimitIntervalSec=0\n\n[Service]\nType=simple\nWorkingDirectory=/opt/apex-forex/apex-affiliate-bot\nExecStart=/usr/bin/python3 main.py\nRestart=always\nRestartSec=10\nStandardOutput=append:/var/log/apex-affiliate.log\nStandardError=append:/var/log/apex-affiliate.log\nEnvironment=PYTHONUNBUFFERED=1\n\n[Install]\nWantedBy=multi-user.target\n' | sudo tee /etc/systemd/system/apex-affiliate.service > /dev/null
          sudo systemctl daemon-reload
          sudo systemctl enable apex-affiliate
          sudo systemctl restart apex-affiliate
          sleep 5
          sudo systemctl is-active apex-affiliate && echo "SUCCESS" || \
            (tail -20 /var/log/apex-affiliate.log && exit 1)
          REMOTE

      - name: Show logs
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            opc@${{ github.event.inputs.vm_ip }} \
            "sudo tail -20 /var/log/apex-affiliate.log"
