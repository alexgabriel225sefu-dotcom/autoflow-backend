name: Deploy Apex Affiliate Bot

on:
  workflow_dispatch:
    inputs:
      vm_ip:
        description: 'Oracle Cloud VM IP address'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/arcads-external-api-gExX7

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ github.event.inputs.vm_ip }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Wait for SSH (retry 5x)
        run: |
          for i in 1 2 3 4 5; do
            if ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -o BatchMode=yes \
              -o ConnectTimeout=20 \
              opc@${{ github.event.inputs.vm_ip }} "echo SSH_OK"; then
              echo "SSH OK on attempt $i"
              break
            fi
            echo "Attempt $i failed, waiting 20s..."
            sleep 20
            if [ $i -eq 5 ]; then
              echo "ERROR: Cannot connect. Reboot the VM from Oracle Cloud Console."
              exit 1
            fi
          done

      - name: Deploy affiliate bot code
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -o ConnectTimeout=120 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            opc@${{ github.event.inputs.vm_ip }} bash -s << 'REMOTE'
          set -e

          echo "[deploy] Downloading latest code..."
          sudo rm -rf /opt/apex-forex/apex-affiliate-bot
          sudo mkdir -p /opt/apex-forex/apex-affiliate-bot

          curl -sL "https://github.com/alexgabriel225sefu-dotcom/autoflow-backend/archive/refs/heads/claude/arcads-external-api-gExX7.tar.gz" \
            | sudo tar xz -C /tmp/apex-deploy --strip-components=1 2>/dev/null || \
            (sudo mkdir -p /tmp/apex-deploy && curl -sL "https://github.com/alexgabriel225sefu-dotcom/autoflow-backend/archive/refs/heads/claude/arcads-external-api-gExX7.tar.gz" | sudo tar xz -C /tmp/apex-deploy --strip-components=1)

          sudo cp -r /tmp/apex-deploy/apex-affiliate-bot/. /opt/apex-forex/apex-affiliate-bot/
          sudo rm -rf /tmp/apex-deploy

          cd /opt/apex-forex/apex-affiliate-bot
          sudo python3 -m pip install -q --prefer-binary --ignore-installed -r requirements.txt
          echo "[deploy] Affiliate bot code ready."
          REMOTE

      - name: Write affiliate bot .env
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            opc@${{ github.event.inputs.vm_ip }} \
            "sudo tee /opt/apex-forex/apex-affiliate-bot/.env > /dev/null" << 'ENVEOF'
          AFFILIATE_BOT_TOKEN=${{ secrets.AFFILIATE_BOT_TOKEN }}
          ADMIN_CHAT_ID=${{ secrets.FOREX_TELEGRAM_CHAT_ID }}
          SITE_URL=https://aicashsystem.space
          WEBHOOK_SECRET=${{ secrets.AFFILIATE_WEBHOOK_SECRET }}
          COMMISSION_PCT=0.30
          AFFILIATE_PORT=3002
          ENVEOF

      - name: Setup systemd service + start affiliate bot
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=5 \
            opc@${{ github.event.inputs.vm_ip }} bash -s << 'REMOTE'
          set -e

          sudo tee /etc/systemd/system/apex-affiliate.service > /dev/null << 'SERVICE'
[Unit]
Description=Apex Affiliate Bot
After=network.target
StartLimitIntervalSec=0

[Service]
Type=simple
WorkingDirectory=/opt/apex-forex/apex-affiliate-bot
ExecStart=/usr/bin/python3 main.py
Restart=always
RestartSec=10
StandardOutput=append:/var/log/apex-affiliate.log
StandardError=append:/var/log/apex-affiliate.log
Environment=PYTHONUNBUFFERED=1

[Install]
WantedBy=multi-user.target
SERVICE

          sudo systemctl daemon-reload
          sudo systemctl enable apex-affiliate
          sudo systemctl restart apex-affiliate
          sleep 5
          sudo systemctl is-active apex-affiliate && echo "SUCCESS: Affiliate Bot running!" || \
            (echo "ERROR: Affiliate Bot failed" && tail -30 /var/log/apex-affiliate.log && exit 1)
          REMOTE
