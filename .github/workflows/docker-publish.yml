name: Build & Publish Bot Images

# Builds the customer-facing Docker images and pushes them to the GitHub
# Container Registry (ghcr.io). Customers deploy these images on Railway with
# nothing but a LICENSE_KEY — they never touch the source or GitHub.
on:
  workflow_dispatch:
  push:
    branches: [main, claude/arcads-external-api-gExX7]
    paths:
      - apex-forex-bot/**
      - apex-trade-bot/**
      - .github/workflows/docker-publish.yml

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: apex-forex-bot
            context: apex-forex-bot
          - name: apex-trade-bot
            context: apex-trade-bot
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: img
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ steps.img.outputs.repo }}:latest
            ${{ steps.img.outputs.repo }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
