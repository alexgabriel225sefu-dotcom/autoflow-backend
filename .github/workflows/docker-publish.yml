name: Build & Publish Bot Images

# Builds the customer-facing Docker images and pushes them to the GitHub
# Container Registry (ghcr.io). Customers deploy these images on Railway with
# nothing but a LICENSE_KEY — they never touch the source or GitHub.
on:
  workflow_dispatch:
  push:
    branches: [main, claude/arcads-external-api-gExX7]
    paths:
      - apex-forex-bot/**
      - .github/workflows/docker-publish.yml

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # ONE image. The retired `apex-crypto` image was built from the
    # apex-trade-bot/ context — a legacy implementation that is not part of
    # this product's architecture and clears none of its safety gates — and
    # the sales site handed customers a Railway deploy command for it. That
    # is exactly the "alternative production path" this repository must not
    # have, so both the image and its source are gone.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: apex-forex
            context: apex-forex-bot
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: img
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ steps.img.outputs.repo }}:latest
            ${{ steps.img.outputs.repo }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
