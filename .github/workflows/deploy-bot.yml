name: Deploy Apex Trade Bot

on:
  workflow_dispatch:
    inputs:
      vm_ip:
        description: 'Oracle Cloud VM IP address'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/arcads-external-api-gExX7

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ github.event.inputs.vm_ip }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Wait for SSH (retry 5x)
        run: |
          for i in 1 2 3 4 5; do
            if ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -o BatchMode=yes \
              -o ConnectTimeout=20 \
              opc@${{ github.event.inputs.vm_ip }} "echo SSH_OK"; then
              echo "SSH OK on attempt $i"
              break
            fi
            echo "Attempt $i failed, waiting 20s..."
            sleep 20
            if [ $i -eq 5 ]; then
              echo "ERROR: Cannot connect. Reboot the VM from Oracle Cloud Console."
              exit 1
            fi
          done

      - name: Add swap + install Node.js + clone repo
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -o ConnectTimeout=120 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            opc@${{ github.event.inputs.vm_ip }} bash -s << 'REMOTE'
          set -e

          # ── 1. Swap (2GB) — prevents OOM crashes ──────────────────
          if [ ! -f /swapfile ]; then
            echo "[swap] Creating 2GB swap file..."
            sudo fallocate -l 2G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
            echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
            echo "[swap] Done — $(free -h | grep Swap)"
          else
            echo "[swap] Already exists — $(free -h | grep Swap)"
          fi

          # ── 2. Node.js (only if not installed) ───────────────────
          if ! command -v node &>/dev/null; then
            echo "[node] Installing Node.js 20..."
            curl -fsSL https://rpm.nodesource.com/setup_20.x | sudo bash -
            sudo dnf install -y nodejs git
          fi
          echo "[node] $(node --version)"

          # ── 3. Clone repo ──────────────────────────────────────────
          echo "[deploy] Cloning latest code..."
          sudo rm -rf /opt/apex-bot
          sudo git clone --depth 1 -b claude/arcads-external-api-gExX7 \
            https://github.com/alexgabriel225sefu-dotcom/autoflow-backend.git /opt/apex-bot
          cd /opt/apex-bot/apex-trade-bot
          sudo npm install --production
          echo "[deploy] Code ready."
          REMOTE

      - name: Write .env
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            opc@${{ github.event.inputs.vm_ip }} \
            "sudo tee /opt/apex-bot/apex-trade-bot/.env > /dev/null" << 'ENVEOF'
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          MASTER_KEY=${{ secrets.MASTER_KEY }}
          BINANCE_TESTNET=true
          NODE_ENV=production
          ENVEOF

      - name: Setup systemd service + start bot
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=5 \
            opc@${{ github.event.inputs.vm_ip }} bash -s << 'REMOTE'
          set -e

          # Kill any old nohup processes
          sudo pkill -f index-server.js 2>/dev/null || true
          sleep 2

          # Create systemd service (auto-restart on crash)
          sudo tee /etc/systemd/system/apex-bot.service > /dev/null << 'SERVICE'
          [Unit]
          Description=Apex Trade Bot
          After=network.target
          StartLimitIntervalSec=0

          [Service]
          Type=simple
          WorkingDirectory=/opt/apex-bot/apex-trade-bot
          ExecStart=/usr/bin/node src/index-server.js
          Restart=always
          RestartSec=10
          StandardOutput=append:/var/log/apex-bot.log
          StandardError=append:/var/log/apex-bot.log
          Environment=NODE_ENV=production

          [Install]
          WantedBy=multi-user.target
          SERVICE

          sudo systemctl daemon-reload
          sudo systemctl enable apex-bot
          sudo systemctl restart apex-bot
          sleep 5
          sudo systemctl is-active apex-bot && echo "SUCCESS: Bot running via systemd!" || (echo "ERROR: Bot failed to start" && tail -30 /var/log/apex-bot.log && exit 1)
          REMOTE
