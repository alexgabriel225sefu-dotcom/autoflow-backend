name: Deploy Apex Trade Bot

on:
  workflow_dispatch:
    inputs:
      vm_ip:
        description: 'Oracle Cloud VM IP address'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout bot branch (with full code)
        uses: actions/checkout@v4
        with:
          ref: claude/arcads-external-api-gExX7

      - name: npm install on runner (fast internet)
        run: |
          cd apex-trade-bot
          npm install --production
          echo "node_modules size: $(du -sh node_modules | cut -f1)"

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ github.event.inputs.vm_ip }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Test SSH connection
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            opc@${{ github.event.inputs.vm_ip }} "echo SSH_OK"

      - name: Install Node.js, swap & prep dirs
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -o ConnectTimeout=60 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=5 \
            opc@${{ github.event.inputs.vm_ip }} bash -s << 'REMOTE'
          set -e
          # 2GB swap so the 1GB micro VM never runs out of memory
          if ! sudo swapon --show | grep -q '/swapfile'; then
            echo "Creating 2GB swap..."
            sudo fallocate -l 2G /swapfile 2>/dev/null || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
            grep -q '/swapfile' /etc/fstab || echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
          fi
          echo "Memory:"; free -h

          if ! command -v node &>/dev/null; then
            echo "Installing Node.js 20 binary..."
            curl -fsSL https://nodejs.org/dist/v20.19.2/node-v20.19.2-linux-x64.tar.gz \
              | sudo tar -xz -C /usr/local --strip-components=1
          fi
          sudo ln -sf /usr/local/bin/node /usr/bin/node
          sudo ln -sf /usr/local/bin/npm /usr/bin/npm
          echo "Node: $(/usr/bin/node --version)"
          sudo mkdir -p /opt/apex-bot/apex-trade-bot
          sudo mkdir -p /var/lib/apex-bot
          REMOTE

      - name: Bundle and copy bot to VM (no npm on VM!)
        run: |
          echo "Bundling bot files..."
          tar czf /tmp/apex-bot.tar.gz -C apex-trade-bot .
          echo "Bundle size: $(du -sh /tmp/apex-bot.tar.gz | cut -f1)"

          echo "Copying to VM..."
          scp -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            /tmp/apex-bot.tar.gz \
            opc@${{ github.event.inputs.vm_ip }}:/tmp/apex-bot.tar.gz

          echo "Extracting on VM..."
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            opc@${{ github.event.inputs.vm_ip }} bash -s << 'REMOTE'
          set -e
          sudo rm -rf /opt/apex-bot/apex-trade-bot
          sudo mkdir -p /opt/apex-bot/apex-trade-bot
          sudo tar xzf /tmp/apex-bot.tar.gz -C /opt/apex-bot/apex-trade-bot/
          rm /tmp/apex-bot.tar.gz
          echo "Files ready: $(ls /opt/apex-bot/apex-trade-bot/src/)"
          REMOTE

      - name: Write .env file
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            opc@${{ github.event.inputs.vm_ip }} \
            "sudo tee /opt/apex-bot/apex-trade-bot/.env > /dev/null" << 'ENVEOF'
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          MASTER_KEY=${{ secrets.MASTER_KEY }}
          ADMIN_CHAT_ID=${{ secrets.ADMIN_CHAT_ID }}
          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
          USER_DATA_DIR=/var/lib/apex-bot
          NODE_ENV=production
          ENVEOF

      - name: Kill orphan processes & start fresh
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=20 \
            -o ServerAliveCountMax=5 \
            opc@${{ github.event.inputs.vm_ip }} bash -s << 'REMOTE'
          set -e

          # Stop systemd service if it exists
          sudo systemctl stop apex-bot 2>/dev/null || true

          # Kill ANY lingering node processes (old nohup, orphan workers, etc.)
          sudo pkill -9 -f 'index-server.js' 2>/dev/null || true
          sudo pkill -9 -f 'node src/' 2>/dev/null || true
          sleep 2

          echo "All node processes stopped. Running processes:"
          ps aux | grep node | grep -v grep || echo "(none)"

          # Write systemd unit — auto-restarts on crash, starts on VM boot
          sudo tee /etc/systemd/system/apex-bot.service > /dev/null << 'UNIT'
          [Unit]
          Description=Apex Trade Bot
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          WorkingDirectory=/opt/apex-bot/apex-trade-bot
          ExecStart=/usr/local/bin/node src/index-server.js
          Restart=always
          RestartSec=5
          EnvironmentFile=/opt/apex-bot/apex-trade-bot/.env
          StandardOutput=journal
          StandardError=journal
          SyslogIdentifier=apex-bot

          [Install]
          WantedBy=multi-user.target
          UNIT

          sudo systemctl daemon-reload
          sudo systemctl enable apex-bot
          sudo systemctl start apex-bot
          sleep 5

          # Verify it started
          sudo systemctl is-active apex-bot && echo "SUCCESS: apex-bot service is running!" \
            || (echo "ERROR: service failed to start" && sudo journalctl -u apex-bot -n 50 --no-pager && exit 1)
          REMOTE
