name: Railway Create Template
on:
  workflow_dispatch:
  push:
    branches: [claude/arcads-external-api-gExX7]
    paths:
      - scripts/railway-create-template.js
      - .github/workflows/railway-create-template.yml
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Create Railway docker template
        run: node scripts/railway-create-template.js
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
