services:
  # 'web' (not 'background') with a $PORT health check. Starter ($7/mo) so the
  # affiliate bot is always-on without burning the shared free 750h pool.
  - type: web
    name: apex-affiliate-bot
    env: python
    buildCommand: pip install -r requirements.txt
    # -u = unbuffered stdout so startup logs show in Render's log tab live
    startCommand: python -u main.py
    plan: starter
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      # Telegram token from @BotFather for the affiliate/ref bot.
      - key: AFFILIATE_BOT_TOKEN
        sync: false
      # Main site that hosts the affiliate API (server.js + Supabase).
      - key: SITE_URL
        value: "https://aicashsystem.space"
      # MUST match AFFILIATE_BOT_SECRET (or JWT_SECRET) on the main server,
      # or telegram-link / telegram-stats calls are rejected with 403.
      - key: AFFILIATE_BOT_SECRET
        sync: false
      # Telegram chat id allowed to use /admin.
      - key: ADMIN_CHAT_ID
        sync: false
