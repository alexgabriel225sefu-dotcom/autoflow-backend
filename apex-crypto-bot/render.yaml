services:
  # 'web' (not 'background') with a $PORT health check. Starter ($7/mo) so the
  # bot is always-on — a trading bot must run 24/7 to scan and trade, which
  # blows past the free 750h pool. On Starter it no longer needs the self-ping.
  - type: web
    name: apex-crypto-bot
    env: python
    # Frankfurt (EU) — Binance geo-blocks trading from US regions (Oregon/Ohio/
    # Virginia return "restricted location"). EU/Asia regions can place orders.
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    plan: starter
    autoDeploy: true
    envVars:
      # Required: bot token from @BotFather + a free Groq key (console.groq.com).
      # Owner gets /grant /revoke /users; everyone else is a paying client,
      # activated instantly when they open the Telegram deep link.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
