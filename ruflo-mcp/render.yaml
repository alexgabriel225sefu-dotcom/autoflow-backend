services:
  - type: web
    name: ruflo-mcp
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    # Without this, Render only restarts the instance when the process exits —
    # a hang (e.g. a stuck Redis poll eating every worker thread) leaves it
    # running but unresponsive to every open Claude conversation at once, and
    # nothing brings it back. The health check lets Render detect that and
    # restart automatically.
    healthCheckPath: /healthz
    # Scope auto-deploy to this folder only. This repo also holds
    # apex-forex-bot/ and apex-crypto-bot/ — without this filter, ANY commit
    # to the branch (even one only touching a bot's code) redeploys this
    # server too, killing the live connector session out from under an
    # already-open Claude chat. That's what made the connector look like it
    # "kept disconnecting" all day: it was actually restarting on every
    # unrelated bot fix.
    buildFilter:
      paths:
        - ruflo-mcp/**
    envVars:
      - key: UPSTASH_REDIS_REST_URL
        sync: false          # forex Upstash
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false          # forex Upstash
      - key: UPSTASH_CRYPTO_URL
        sync: false          # crypto Upstash (falls back to UPSTASH_REDIS_REST_URL)
      - key: UPSTASH_CRYPTO_TOKEN
        sync: false          # crypto Upstash (falls back to UPSTASH_REDIS_REST_TOKEN)
      - key: RUFLO_MCP_SECRET
        generateValue: true  # becomes the secret path segment in the connector URL
      - key: SITE_URL
        value: https://aicashsystem.space   # affiliate reads via the website API
      - key: AFFILIATE_BOT_SECRET
        sync: false          # same value as the affiliate bot / server.js
      - key: AFFILIATE_BOT_TOKEN
        sync: false          # affiliate bot token, for messaging affiliates
