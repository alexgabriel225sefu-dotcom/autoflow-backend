<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout · Apex Forex ATC</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
body{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#fff;color:#30313d}
.top{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid #e6e6e6}
.top .bk{font-size:22px;color:#6b7280}
.top .mer{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;color:#1a1a1a}
.top .logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#ff2d4f,#ff5c74);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px}
.summary{padding:26px 24px 18px}
.summary .lbl{font-size:15px;color:#6b7280;font-weight:500}
.summary .amt{font-size:38px;font-weight:700;color:#1a1a1a;letter-spacing:-.02em;margin:6px 0 2px}
.summary .item{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-top:18px;border-top:1px solid #ededed;font-size:15px}
.summary .item .nm{color:#30313d;font-weight:500}
.summary .item .nm small{display:block;color:#8a8a8a;font-weight:400;font-size:13px;margin-top:2px}
.summary .item .pr{font-weight:600}
.form{padding:6px 24px 30px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:500;color:#30313d;margin-bottom:6px}
.inp{border:1px solid #e0e0e0;border-radius:9px;padding:13px 14px;font-size:15px;color:#1a1a1a;background:#fff;
  box-shadow:0 1px 1px rgba(0,0,0,.03);display:flex;align-items:center;justify-content:space-between}
.inp .ph{color:#1a1a1a}
.card-icons{display:flex;gap:5px}
.ci{width:30px;height:20px;border-radius:3px;font-size:9px;font-weight:800;color:#fff;display:flex;align-items:center;justify-content:center}
.row2{display:flex;gap:10px}
.row2 .field{flex:1}
.paybtn{margin-top:18px;background:#ff2d4f;color:#fff;font-size:17px;font-weight:600;text-align:center;
  padding:15px;border-radius:10px;box-shadow:0 2px 8px rgba(255,45,79,.35);transition:transform .15s}
.paybtn.tap{transform:scale(.97)}
.secure{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:18px;color:#8a8a8a;font-size:13px}
.lock{font-size:13px}
.powered{text-align:center;margin-top:14px;color:#b3b3b3;font-size:12px;font-weight:500}
.powered b{color:#6b7280}
</style></head><body>
<div class="top">
  <span class="bk">‹</span>
  <div class="mer"><span class="logo">A</span>Apex Trading Suite</div>
</div>
<div class="summary">
  <div class="lbl">Pay Apex Trading Suite</div>
  <div class="amt">US$497.00</div>
  <div class="item">
    <div class="nm">Apex Forex ATC<small>Forex bot license · one-time</small></div>
    <div class="pr">US$497.00</div>
  </div>
</div>
<div class="form">
  <div class="field">
    <label>Email</label>
    <div class="inp"><span class="ph">alex.trader@gmail.com</span></div>
  </div>
  <div class="field">
    <label>Card information</label>
    <div class="inp"><span class="ph">4242 4242 4242 4242</span>
      <span class="card-icons"><span class="ci" style="background:#1a1f71">VISA</span></span></div>
    <div class="row2" style="margin-top:8px">
      <div class="field" style="margin:0"><div class="inp"><span class="ph">09 / 28</span></div></div>
      <div class="field" style="margin:0"><div class="inp"><span class="ph">123</span></div></div>
    </div>
  </div>
  <div class="field">
    <label>Cardholder name</label>
    <div class="inp"><span class="ph">Alex Trader</span></div>
  </div>
  <div class="field">
    <label>Country or region</label>
    <div class="inp"><span class="ph">United States</span><span style="color:#9aa0a6">▾</span></div>
  </div>
  <div class="paybtn" id="paybtn">Pay US$497.00</div>
  <div class="secure"><span class="lock">🔒</span>Secure checkout</div>
  <div class="powered">Powered by <b>stripe</b>  ·  Terms  Privacy</div>
</div>
</body></html>
