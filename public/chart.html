<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Apex Chart</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#050814;overflow:hidden;font-family:system-ui,sans-serif}
#header{
  position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;
  background:rgba(5,8,20,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,.08);
  height:48px;
}
#sym-display{
  display:flex;align-items:center;gap:8px;
  font-size:15px;font-weight:700;color:#f5f5f7;letter-spacing:-.01em;
}
#sym-display span{
  font-size:11px;font-weight:500;color:#56565f;letter-spacing:.05em;
  background:rgba(255,255,255,.06);padding:3px 8px;border-radius:20px;
}
#apex-label{font-size:12px;color:#ff2d4f;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
#chart-wrap{position:absolute;top:48px;left:0;right:0;bottom:0}
#tv_chart{width:100%;height:100%}
</style>
</head>
<body>
<div id="header">
  <div id="sym-display">
    <span id="sym-text">BTCUSDT</span>
    <div id="apex-label">⚡ APEX</div>
  </div>
  <div id="apex-label" style="font-size:11px;color:#56565f">TradingView Live</div>
</div>

<div id="chart-wrap">
  <div id="tv_chart"></div>
</div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
// Init Telegram Mini App
var tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

// Read symbol from URL — bot passes ?s=SOLUSDT
var params = new URLSearchParams(window.location.search);
var rawSym = (params.get('s') || 'BTCUSDT').toUpperCase().replace(/[^A-Z0-9]/g, '');
var tvSym  = rawSym.includes(':') ? rawSym : 'BINANCE:' + rawSym;

document.getElementById('sym-text').textContent = rawSym;

// Detect dark/light from Telegram theme
var isDark = !tg || tg.colorScheme !== 'light';

new TradingView.widget({
  container_id:        'tv_chart',
  width:               '100%',
  height:              '100%',
  symbol:              tvSym,
  interval:            '15',
  timezone:            'Etc/UTC',
  theme:               isDark ? 'dark' : 'light',
  style:               '1',
  locale:              'en',
  toolbar_bg:          '#050814',
  enable_publishing:   false,
  hide_side_toolbar:   false,
  allow_symbol_change: true,
  save_image:          false,
  studies: ['RSI@tv-basicstudies', 'MACD@tv-basicstudies'],
  overrides: {
    'paneProperties.background':            '#050814',
    'paneProperties.backgroundType':        'solid',
    'paneProperties.vertGridProperties.color': 'rgba(255,255,255,0.04)',
    'paneProperties.horzGridProperties.color': 'rgba(255,255,255,0.04)',
  },
  loading_screen: { backgroundColor: '#050814', foregroundColor: '#ff2d4f' },
});
</script>
</body>
</html>
