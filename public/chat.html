<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>AI Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--r:#E53E2E;--r2:#FF5544;--bg:#080808;--bg2:#0f0f0f;--bg3:#161616;--t1:#fff;--t2:#c8c8c8;--t4:#555}
body{background:var(--bg);color:var(--t1);font-family:'Inter',sans-serif;height:100dvh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

.topbar{padding:14px 18px;border-bottom:1px solid #111;display:flex;align-items:center;gap:12px;flex-shrink:0}
.bot-avatar{width:36px;height:36px;background:var(--r);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;flex-shrink:0}
.bot-name{font-size:14px;font-weight:700;color:var(--t1)}
.bot-status{font-size:11px;color:#4ade80;display:flex;align-items:center;gap:5px}
.bot-status::before{content:'';width:6px;height:6px;background:#4ade80;border-radius:50%;display:inline-block;box-shadow:0 0 5px rgba(74,222,128,.5)}
.powered{margin-left:auto;font-size:10px;color:var(--t4);letter-spacing:.5px}
.powered span{color:#333}

.messages{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:14px}
.messages::-webkit-scrollbar{width:3px}
.messages::-webkit-scrollbar-thumb{background:#1a1a1a;border-radius:2px}

.msg{display:flex;gap:10px;align-items:flex-end;animation:fadeUp .25s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.user{flex-direction:row-reverse}
.msg-avatar{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.msg-avatar.bot{background:var(--r)}
.msg-avatar.user{background:#1e1e1e;border:1px solid #222;color:var(--t4)}
.bubble{max-width:78%;padding:11px 15px;border-radius:16px;font-size:13px;line-height:1.7}
.bubble.bot{background:var(--bg2);border:1px solid #1a1a1a;color:var(--t2);border-bottom-left-radius:4px}
.bubble.user{background:var(--r);color:#fff;border-bottom-right-radius:4px}

.typing{display:flex;gap:5px;padding:4px 2px;align-items:center}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--r);opacity:.4;animation:bounce .9s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,100%{opacity:.2;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}

.input-area{padding:12px 16px;border-top:1px solid #111;display:flex;gap:10px;align-items:flex-end;flex-shrink:0;background:var(--bg)}
.input-box{flex:1;background:var(--bg2);border:1px solid #1a1a1a;border-radius:12px;padding:11px 15px;font-family:'Inter',sans-serif;font-size:13px;color:var(--t1);outline:none;resize:none;min-height:44px;max-height:120px;line-height:1.6;transition:border-color .2s}
.input-box:focus{border-color:rgba(229,62,46,.4)}
.send-btn{width:44px;height:44px;background:var(--r);border:none;border-radius:12px;cursor:pointer;font-size:17px;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.send-btn:hover{background:var(--r2);transform:translateY(-1px)}
.send-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

.error-bar{background:rgba(229,62,46,.1);border-top:1px solid rgba(229,62,46,.2);padding:10px 18px;font-size:12px;color:var(--r);text-align:center;display:none}

.welcome{text-align:center;padding:40px 20px;color:var(--t4)}
.welcome-icon{font-size:40px;margin-bottom:14px;opacity:.3}
.welcome-text{font-size:13px;line-height:1.7}
</style>
</head>
<body>

<div class="topbar">
  <div class="bot-avatar" id="botInitial">A</div>
  <div>
    <div class="bot-name" id="botName">AI Assistant</div>
    <div class="bot-status">Online · Ready to help</div>
  </div>
  <div class="powered">Powered by <span>AutoFlow</span></div>
</div>

<div class="messages" id="messages">
  <div class="welcome" id="welcome">
    <div class="welcome-icon">◎</div>
    <div class="welcome-text">Hi! I'm your AI assistant.<br>Type a message to get started.</div>
  </div>
</div>

<div class="error-bar" id="errorBar">Connection error. Please refresh the page.</div>

<div class="input-area">
  <textarea class="input-box" id="inputBox" placeholder="Type your message..." rows="1"></textarea>
  <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
</div>

<script>
const webhookId = location.pathname.split('/chat/')[1]?.split('/')[0];
let botName = 'AI Assistant';
let isActive = true;

async function init(){
  if(!webhookId){ showError('Invalid chat link.'); return; }
  try {
    const r = await fetch('/api/chat/'+webhookId+'/info');
    const d = await r.json();
    if(d.error){ showError('This chat link is not available.'); return; }
    botName = d.name || 'AI Assistant';
    document.getElementById('botName').textContent = botName;
    document.getElementById('botInitial').textContent = botName[0].toUpperCase();
    document.title = botName;
    isActive = d.active;
    if(!isActive) showError('This assistant is currently paused.');
  } catch(e){ /* use defaults */ }
}

function showError(msg){
  const bar = document.getElementById('errorBar');
  bar.textContent = msg;
  bar.style.display = 'block';
  document.getElementById('sendBtn').disabled = true;
  document.getElementById('inputBox').disabled = true;
}

function addMsg(text, role){
  const welcome = document.getElementById('welcome');
  if(welcome) welcome.remove();
  const wrap = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg '+role;
  const initial = role === 'bot' ? botName[0].toUpperCase() : 'U';
  div.innerHTML = `<div class="msg-avatar ${role}">${initial}</div><div class="bubble ${role}">${text.replace(/\n/g,'<br>')}</div>`;
  wrap.appendChild(div);
  wrap.scrollTop = wrap.scrollHeight;
  return div;
}

function addTyping(){
  const welcome = document.getElementById('welcome');
  if(welcome) welcome.remove();
  const wrap = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg bot'; div.id = 'typing';
  div.innerHTML = `<div class="msg-avatar bot">${botName[0].toUpperCase()}</div><div class="bubble bot"><div class="typing"><span></span><span></span><span></span></div></div>`;
  wrap.appendChild(div);
  wrap.scrollTop = wrap.scrollHeight;
}

async function sendMessage(){
  const box = document.getElementById('inputBox');
  const btn = document.getElementById('sendBtn');
  const msg = box.value.trim();
  if(!msg || btn.disabled) return;
  box.value = ''; box.style.height = 'auto';
  addMsg(msg, 'user');
  btn.disabled = true;
  addTyping();
  try {
    const r = await fetch('/webhook/'+webhookId, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({message: msg})
    });
    const d = await r.json();
    document.getElementById('typing')?.remove();
    if(d.reply){ addMsg(d.reply, 'bot'); }
    else { addMsg('Sorry, I could not process your message. Please try again.', 'bot'); }
  } catch(e){
    document.getElementById('typing')?.remove();
    addMsg('Connection error. Please try again.', 'bot');
  }
  btn.disabled = false;
  box.focus();
}

document.getElementById('inputBox').addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
});
document.getElementById('inputBox').addEventListener('input', function(){
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120)+'px';
});

init();
</script>
</body>
</html>
