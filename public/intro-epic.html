<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>AI Cash Systems</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}

.act{
  font-family:'Inter',sans-serif;
  font-size:clamp(80px,18vw,180px);
  font-weight:900;
  line-height:.9;
  letter-spacing:-6px;
  color:#E53E2E;
  text-align:center;
  opacity:0;
  transform:scale(.88);
  animation:in .55s .1s cubic-bezier(.34,1.56,.64,1) forwards;
  filter:drop-shadow(0 0 80px rgba(229,62,46,.35));
  user-select:none;
  cursor:pointer;
}
@keyframes in{to{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<div class="act" id="act">ACT<br>NOW.</div>
<script>
var el = document.getElementById('act');
function go(){
  el.style.transition = 'opacity .6s ease, transform .6s ease';
  el.style.opacity = '0';
  el.style.transform = 'scale(1.06)';
  setTimeout(function(){ window.location.href = '/'; }, 600);
}
setTimeout(go, 2000);
el.addEventListener('click', go);
document.body.addEventListener('click', go);
</script>
</body>
</html>
