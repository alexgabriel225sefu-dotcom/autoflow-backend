<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apex Bot — Affiliate Program</title>
<style>
  :root{--bg:#050814;--card:#0c1224;--border:rgba(255,255,255,.08);--text:#f5f5f7;--muted:#8a8fa3;--accent:#f59e0b;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding:48px 20px;}
  .wrap{max-width:560px;margin:0 auto;}
  h1{font-size:28px;letter-spacing:-0.02em;margin:0 0 8px;}
  p.sub{color:var(--muted);margin:0 0 32px;font-size:15px;line-height:1.6;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px;margin-bottom:24px;}
  .card h2{font-size:16px;margin:0 0 16px;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;margin-top:14px;}
  input{width:100%;padding:12px 14px;background:#0a0e1f;border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:15px;}
  input:focus{outline:none;border-color:var(--accent);}
  button{width:100%;margin-top:20px;padding:13px;border:none;border-radius:10px;background:var(--accent);color:#0a0a0a;font-weight:600;font-size:15px;cursor:pointer;}
  button:disabled{opacity:.5;cursor:not-allowed;}
  .msg{margin-top:16px;font-size:14px;padding:12px 14px;border-radius:10px;display:none;}
  .msg.ok{display:block;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:#4ade80;}
  .msg.err{display:block;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#f87171;}
  .link-box{display:flex;gap:8px;margin-top:8px;}
  .link-box input{font-family:monospace;font-size:13px;}
  .copy-btn{width:auto;padding:0 16px;white-space:nowrap;}
  .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;}
  .stat{background:#0a0e1f;border:1px solid var(--border);border-radius:10px;padding:14px;}
  .stat .label{font-size:12px;color:var(--muted);}
  .stat .value{font-size:20px;font-weight:600;margin-top:4px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Apex Bot Affiliate Program</h1>
  <p class="sub">Promote Apex Trade Bot to your audience and earn a commission on every $297 sale that comes through your link.</p>

  <div class="card">
    <h2>Become an affiliate</h2>
    <label for="afName">Your name</label>
    <input id="afName" type="text" placeholder="Your name">
    <label for="afEmail">Email</label>
    <input id="afEmail" type="email" placeholder="you@example.com">
    <label for="afTiktok">TikTok handle (optional)</label>
    <input id="afTiktok" type="text" placeholder="@yourhandle">
    <button id="afApplyBtn" onclick="applyAffiliate()">Get my link</button>
    <div id="afMsg" class="msg"></div>
    <div id="afLinkWrap" style="display:none">
      <label>Your referral link</label>
      <div class="link-box">
        <input id="afLink" type="text" readonly>
        <button class="copy-btn" onclick="copyLink()">Copy</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Check your stats</h2>
    <label for="afCode">Your affiliate code</label>
    <input id="afCode" type="text" placeholder="e.g. alexb3f2">
    <button onclick="checkStats()">Check stats</button>
    <div id="statsMsg" class="msg"></div>
    <div id="statsGrid" class="stats-grid" style="display:none">
      <div class="stat"><div class="label">Sales</div><div class="value" id="stSales">0</div></div>
      <div class="stat"><div class="label">Commission %</div><div class="value" id="stPct">0%</div></div>
      <div class="stat"><div class="label">Total earned</div><div class="value" id="stTotal">$0</div></div>
      <div class="stat"><div class="label">Unpaid</div><div class="value" id="stUnpaid">$0</div></div>
    </div>
  </div>
</div>

<script>
function showMsg(el, text, ok){
  el.textContent = text;
  el.className = 'msg ' + (ok ? 'ok' : 'err');
}
async function applyAffiliate(){
  var name = document.getElementById('afName').value.trim();
  var email = document.getElementById('afEmail').value.trim();
  var tiktokHandle = document.getElementById('afTiktok').value.trim();
  var btn = document.getElementById('afApplyBtn');
  var msg = document.getElementById('afMsg');
  if (!email || !email.includes('@')) { showMsg(msg, 'Please enter a valid email.', false); return; }
  btn.disabled = true; btn.textContent = 'Generating...';
  try {
    var r = await fetch('/api/affiliates/apply', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name, email, tiktokHandle }) });
    var d = await r.json();
    if (d.error) { showMsg(msg, d.error, false); btn.disabled = false; btn.textContent = 'Get my link'; return; }
    showMsg(msg, 'You are in! Your code is ' + d.code, true);
    document.getElementById('afLinkWrap').style.display = 'block';
    document.getElementById('afLink').value = d.link;
    document.getElementById('afCode').value = d.code;
  } catch (e) {
    showMsg(msg, 'Error: ' + e.message, false);
  }
  btn.disabled = false; btn.textContent = 'Get my link';
}
function copyLink(){
  var el = document.getElementById('afLink');
  el.select(); document.execCommand('copy');
}
async function checkStats(){
  var code = document.getElementById('afCode').value.trim().toLowerCase();
  var msg = document.getElementById('statsMsg');
  var grid = document.getElementById('statsGrid');
  if (!code) { showMsg(msg, 'Enter your affiliate code.', false); return; }
  try {
    var r = await fetch('/api/affiliates/' + encodeURIComponent(code) + '/stats');
    var d = await r.json();
    if (d.error) { showMsg(msg, d.error, false); grid.style.display = 'none'; return; }
    msg.style.display = 'none';
    grid.style.display = 'grid';
    document.getElementById('stSales').textContent = d.totalSales;
    document.getElementById('stPct').textContent = d.commissionPercent + '%';
    document.getElementById('stTotal').textContent = '$' + (d.totalCommissionCents/100).toFixed(2);
    document.getElementById('stUnpaid').textContent = '$' + (d.unpaidCommissionCents/100).toFixed(2);
  } catch (e) {
    showMsg(msg, 'Error: ' + e.message, false);
    grid.style.display = 'none';
  }
}
</script>
</body>
</html>
